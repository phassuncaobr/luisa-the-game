// ---------- stretches with a play of their own: wheels (scooter, quad bike with papai, shopping cart), the umbrella, the beach balls ----------
// A ride is a zone of the level (L.rides): whoever is inside it is on the vehicle, so a lost life or a checkpoint never leaves her on foot in the middle.
// On wheels she never stops: right speeds up, left brakes, jump jumps. Tracks have no deadly pits: ramps fly over puddles, and a splash only costs a heart.
var RIDES = { pat: { min: 112, cruise: 160, max: 215, run: 0.5, say: 'PATINETE!' },
              quad: { min: 140, cruise: 196, max: 255, run: 1, ram: 1, climb: 1, say: 'QUADRICICLO!' },
              cart: { min: 124, cruise: 176, max: 232, run: 0.6, ram: 1, say: 'CARRINHO!' } };
function rideOn(p) { var a = L && L.rides, i; if (a) for (i = 0; i < a.length; i++) if (p.x >= a[i].x0 && p.x < a[i].x1) return a[i]; return null; }
function glideOn(p) { var a = L && L.glides, i; if (a) for (i = 0; i < a.length; i++) if (p.x >= a[i].x0 && p.x < a[i].x1) return true; return false; }
function rideRam() { return !!(st.rideK && RIDES[st.rideK].ram); }
function rideMove(p, rd, want, dt) {
  var K = RIDES[rd.kind], tgt = want < 0 ? K.min : (want > 0 ? K.max : K.cruise), a = ACC * 0.75 * dt;
  p.vx += Math.max(-a, Math.min(a, tgt - p.vx)); p.face = 1; p.duck = false; p.run = K.run;
}
function rideClimb(p, edge) {            // the quad bike rolls over a step one tile high, with a little hop
  var rd = rideOn(p), top;
  if (!rd || !RIDES[rd.kind].climb || p.vx <= 0) return false;
  top = Math.floor((p.y - 1) / T) * T;
  if (!solidAt(edge, p.y - 1) || solidAt(edge, top - 2) || solidAt(edge, top - 24) || solidAt(p.x, top - 40)) return false;
  p.y = top - 0.01; p.vy = -70; p.ground = false; dustAt(p.x, p.y, 2); return true;
}
